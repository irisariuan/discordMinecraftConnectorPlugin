name: Build Multi-Platform Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build --no-daemon --stacktrace

    - name: Upload Paper Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: paper-plugin
        path: paper/build/libs/*.jar
        if-no-files-found: error

    - name: Upload NeoForge Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: neoforge-plugin
        path: neoforge/build/libs/*.jar
        if-no-files-found: error

    - name: Upload Fabric Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fabric-plugin
        path: fabric/build/libs/*.jar
        if-no-files-found: error

    - name: Upload All Plugins
      uses: actions/upload-artifact@v4
      with:
        name: all-plugins
        path: |
          paper/build/libs/*.jar
          neoforge/build/libs/*.jar
          fabric/build/libs/*.jar
        if-no-files-found: error
