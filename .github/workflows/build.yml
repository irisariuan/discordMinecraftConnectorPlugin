name: Build Multi-Platform Plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle (dependency cache)
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Derive version from release tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: echo "MOD_VERSION_ARG=-PmodVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    # Do NOT run `clean` in the same invocation as `build`. NeoGradle expands the
    # NeoForm patch bundle into neoforge/build/tmp at configuration time; a
    # same-invocation `clean` deletes it and `:neoforge:neoFormSetup` fails with
    # "patches.lzma (No such file or directory)". The runner is a fresh checkout,
    # so there is nothing to clean anyway.
    - name: Build with Gradle
      run: ./gradlew build --no-daemon --stacktrace $MOD_VERSION_ARG

    - name: Upload Paper Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: paper-plugin
        path: |
          paper/build/libs/*.jar
          !paper/build/libs/*-thin.jar
        if-no-files-found: error

    - name: Upload NeoForge Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: neoforge-mod
        path: |
          neoforge/build/libs/*.jar
          !neoforge/build/libs/*-thin.jar
        if-no-files-found: error

    - name: Upload Fabric Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fabric-mod
        path: |
          fabric/build/libs/*.jar
          !fabric/build/libs/*-sources.jar
        if-no-files-found: error

    - name: Upload All Plugins
      uses: actions/upload-artifact@v4
      with:
        name: all-plugins
        path: |
          paper/build/libs/*.jar
          !paper/build/libs/*-thin.jar
          neoforge/build/libs/*.jar
          !neoforge/build/libs/*-thin.jar
          fabric/build/libs/*.jar
          !fabric/build/libs/*-sources.jar
        if-no-files-found: error

  release:
    # Publish a GitHub Release with all three jars when a `v*` tag is pushed,
    # e.g. `git tag v1.0.0 && git push origin v1.0.0`.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download built jars
      uses: actions/download-artifact@v4
      with:
        name: all-plugins
        path: dist

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/**/*.jar
        generate_release_notes: true
        fail_on_unmatched_files: true
